  html, body { margin: 0; padding: 0; background: #0b0e1a; height: 100%; }

<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">WASD / arrows to move &middot; hold Shift to sneak &middot; click to toss a coin &middot; stay out of the yellow cones</div>
</div>
